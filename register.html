<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVFuniture Registration</title>
    <link rel="stylesheet" href="Styles/register.css">
</head>
<body>

    <div class="container">
        <h2>Register Here</h2>
        <form action="php/register.php" method="post">
            <div class="input-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="firstname" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="Password" placeholder="Enter your password" required>
            </div>

            <button type="submit"> <a href="login.html"> Register </a></button>
        </form>
    </div>
    <script type="register.js"></script>

</body>
</html>
