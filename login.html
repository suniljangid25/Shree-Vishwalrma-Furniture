<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVFurniture Login</title>
    <link rel="stylesheet" href="Styles/login.css">
</head>
<body>  
    <div class="container">
        <h2 id="form-title">SVF Login here</h2>
        <!-- form for login -->
        <form id="login-form" onsubmit="redirectToSuccessPage(); return false;">
            <div class="form-group">
                <label for="fullname">Email</label>
                <input type="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <label for="fullname">Password</label>
                <input type="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn"><a href="Index.html">Login</a></button>
            <span class="toggle-link" onclick="toggleForm()"> <a href="register.html">Don't have an account? Register</a></span>
        </form>
        
    </div>
    <script src="login.js"></script>
</body>
</html>
